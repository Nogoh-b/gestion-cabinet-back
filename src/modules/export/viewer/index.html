<html lang="fr">

  <title>Export de dossiers</title>
  <link rel="stylesheet" href="style.css">

  <header class="site-header no-print">
    <div class="wrap">
      <a class="brand" href="#/" id="brand">Export de dossiers</a>
      <span class="brand-sub" id="brand-sub"></span>
    </div>
  </header>
  <main class="wrap" id="app">
    <noscript><p class="notice">Cette consultation hors-ligne nécessite JavaScript.</p></noscript>
  </main>
  <footer class="site-footer no-print">
    <div class="wrap">Consultation hors-ligne &middot; aucune donnée n'est envoyée sur le réseau.</div>
  </footer>

</html>
